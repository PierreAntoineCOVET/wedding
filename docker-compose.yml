x-server: &server
  image: ${DOCKER_REGISTRY-}server
  hostname: 'aerserver'
  build:
    context: .
    dockerfile: Server/Dockerfile
  environment: &server-environment
    ASPNETCORE_HTTP_PORTS: 8080
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
  ports:
    - 5000:8080

services:

  server-dev:
    <<: *server
    profiles:
      - dev
    environment:
      <<: *server-environment
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - db

  server-prod:
    <<: *server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aerserver.rule=Host(`amandineetromain.fr`)"
      - "traefik.http.routers.aerserver.entrypoints=websecure"
      - "traefik.http.routers.aerserver.tls.certresolver=myresolver"
      - "traefik.docker.network=public"
    container_name: wedding-server
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      wedding-db-init:
        condition: service_completed_successfully
    environment:
      <<: *server-environment
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - public
      - internal

  # Prod only: one-shot provisioning of the wedding role + database on the external PostgreSQL
  # server, connecting as its admin role (DB_ADMIN_USER / DB_ADMIN_PASSWORD). Exits early when the
  # database already exists; server-prod starts only after it completes successfully.
  wedding-db-init:
    profiles:
      - prod
    image: postgres:17
    container_name: wedding-db-init
    restart: "no"
    entrypoint: ["bash", "/init/01-create-database.sh"]
    environment:
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infra/postgres/init:/init:ro
    networks:
      - internal

  db:
    profiles:
      - dev
    image: postgres:17
    hostname: 'aerdb'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    expose:
      - '${DB_PORT}'
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - aer-pgdata:/var/lib/postgresql/data

volumes:
  aer-pgdata:
    external: true

# Dev services use the project's default network. Prod uses `public` (shared with Traefik) and
# `internal` (no internet egress, shared with the PostgreSQL server), created by Compose with fixed
# names so every app included by the server master compose declares them identically.
networks:
  public:
    name: public
  internal:
    name: internal
    internal: true