services:

  server:
    image: ${DOCKER_REGISTRY-}server
    hostname: 'aerserver'
    build:
      context: .
      dockerfile: Server/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
# Port should binded to 80 not 5000
    ports:
      - 5000:8080
    networks:
      - myNetwork

  db:
    image: postgres:17
    hostname: 'aerdb'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    expose:
      - '${DB_PORT}'
# Port to localhost should not be on prod
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - aer-pgdata:/var/lib/postgresql/data
    networks:
      - myNetwork

volumes:
  aer-pgdata:
    external: true

networks:
  myNetwork:
